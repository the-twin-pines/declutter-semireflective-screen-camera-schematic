name: Train paper contrast on CPU
on:
  push:
    branches: [work/train-paper-contrast-on-actions]
    paths:
      - 'examples/autogenerated/paper-contrast-training/**'
      - '.github/workflows/train-paper-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit-and-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPILER_REV: 2bce7677f513d711875e978bd6f5ad28b9e54d58
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build the pinned Idriç compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libgmp-dev libncurses-dev zlib1g-dev liblz4-dev curl
          compiler="$RUNNER_TEMP/Idric"
          git init -q "$compiler"
          git -C "$compiler" fetch -q --depth=1 https://github.com/isomorphisms/Idric.git "$COMPILER_REV"
          git -C "$compiler" checkout -q --detach FETCH_HEAD
          test "$(git -C "$compiler" rev-parse HEAD)" = "$COMPILER_REV"
          JOBS=2 "$compiler/edric" bootstrap > "$RUNNER_TEMP/bootstrap.log" 2>&1 || {
            tail -100 "$RUNNER_TEMP/bootstrap.log"
            exit 1
          }
      - name: Compile trainer
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/Idric"
          export CHEZ="$compiler/_/.tools/bin/scheme"
          export PATH="$compiler/_/.tools/bin:$PATH"
          export IDRIS2_PREFIX="$compiler/_/bootstrap-build"
          export IDRIS2_PACKAGE_PATH="$compiler/_/bootstrap-build/idris2-0.8.0"
          export IDRIS2_LIBS="$compiler/_/build/exec/idris2_app"
          source_dir="$GITHUB_WORKSPACE/examples/autogenerated/paper-contrast-training"
          mkdir -p "$RUNNER_TEMP/trainer" "$RUNNER_TEMP/result"
          cd "$source_dir"
          "$compiler/_/build/exec/idris2" --source-dir "$source_dir" --build-dir "$RUNNER_TEMP/build-training" \
            --output-dir "$RUNNER_TEMP/trainer" --cg chez -o paper-contrast PaperContrastTraining.idric
          test -x "$RUNNER_TEMP/trainer/paper-contrast"
      - name: Fit on 64 drawings and score 16 withheld drawings
        shell: bash
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/Idric"
          export CHEZ="$compiler/_/.tools/bin/scheme"
          export PATH="$compiler/_/.tools/bin:$PATH"
          receipt="$RUNNER_TEMP/result"
          git rev-parse HEAD > "$receipt/source-revision.txt"
          echo "$COMPILER_REV" > "$receipt/compiler-revision.txt"
          /usr/bin/time -f 'elapsed_seconds %e\npeak_rss_kib %M' -o "$receipt/time.txt" \
            "$RUNNER_TEMP/trainer/paper-contrast" | tee "$receipt/metrics.tsv"
          cat "$receipt/time.txt"
          cat "$receipt/metrics.tsv" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-contrast-training
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 14
